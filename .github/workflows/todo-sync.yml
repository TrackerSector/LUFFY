name: todo-sync
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/todo-sync.yml'
      - '.github/scripts/todo_sync.py'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure main ref
        run: git fetch origin main:refs/remotes/origin/main
      - name: Run TODO sync
        env:
          MODE: apply
          MAIN_REF: origin/main
        run: python3 .github/scripts/todo_sync.py
